<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900"><defs><style>.title{font:700 22px sans-serif;fill:#2c3e50}.subtitle{font:700 16px sans-serif;fill:#34495e}.label{font:13px sans-serif;fill:#2c3e50}.small-label{font:11px sans-serif;fill:#7f8c8d}.metric{font:700 14px sans-serif}.skip-text{fill:#e74c3c}.count-text{fill:#27ae60}.process-text{fill:#f39c12}.block{stroke:#34495e;stroke-width:2}.count-block{fill:#d5f4e6}.comparison-box{fill:#ecf0f1;stroke:#34495e;stroke-width:2}</style><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><polygon fill="#34495e" points="0 0 10 3 0 6"/></marker></defs><text x="600" y="35" class="title" text-anchor="middle">Skiplist Optimization: Reducing Doc Value Lookups</text><text x="600" y="60" class="subtitle" text-anchor="middle">Query: status=200, Aggregation: hourly buckets, ~12,000 docs/hour</text><rect width="1100" height="60" x="50" y="80" class="comparison-box"/><text x="600" y="105" class="label" text-anchor="middle" style="font-weight:700">Scenario: 24-hour period with 288,000 total documents (12,000 docs/hour average)</text><text x="600" y="125" class="small-label" text-anchor="middle">Skiplist Level 1 blocks: 4,096 documents each = ~70 blocks total | Each block spans ~20 minutes of data</text><text x="50" y="175" class="subtitle">Document Distribution (4,096 doc blocks):</text><text x="100" y="200" class="small-label" text-anchor="middle">00:00</text><text x="300" y="200" class="small-label" text-anchor="middle">06:00</text><text x="500" y="200" class="small-label" text-anchor="middle">12:00</text><text x="700" y="200" class="small-label" text-anchor="middle">18:00</text><text x="900" y="200" class="small-label" text-anchor="middle">23:59</text><text x="50" y="240" class="label" style="font-weight:700">Sample Hour: 14:00-15:00 (3 skiplist blocks)</text><rect width="280" height="100" x="100" y="260" class="block count-block"/><text x="240" y="285" class="label" text-anchor="middle" style="font-weight:700">Block 42 (14:00-14:20)</text><text x="240" y="305" class="small-label" text-anchor="middle">4,096 documents</text><text x="240" y="325" class="small-label" text-anchor="middle">Min @timestamp: 14:00:01</text><text x="240" y="340" class="small-label" text-anchor="middle">Max @timestamp: 14:20:59</text><text x="240" y="355" class="count-text metric" text-anchor="middle">✓ BULK COUNT</text><rect width="280" height="100" x="420" y="260" class="block count-block"/><text x="560" y="285" class="label" text-anchor="middle" style="font-weight:700">Block 43 (14:20-14:40)</text><text x="560" y="305" class="small-label" text-anchor="middle">4,096 documents</text><text x="560" y="325" class="small-label" text-anchor="middle">Min @timestamp: 14:21:00</text><text x="560" y="340" class="small-label" text-anchor="middle">Max @timestamp: 14:40:58</text><text x="560" y="355" class="count-text metric" text-anchor="middle">✓ BULK COUNT</text><rect width="280" height="100" x="740" y="260" class="block count-block"/><text x="880" y="285" class="label" text-anchor="middle" style="font-weight:700">Block 44 (14:40-15:00)</text><text x="880" y="305" class="small-label" text-anchor="middle">4,096 documents</text><text x="880" y="325" class="small-label" text-anchor="middle">Min @timestamp: 14:41:02</text><text x="880" y="340" class="small-label" text-anchor="middle">Max @timestamp: 15:00:59</text><text x="880" y="355" class="count-text metric" text-anchor="middle">✓ BULK COUNT</text><text x="600" y="390" class="small-label" text-anchor="middle" style="font-style:italic">All 3 blocks fall entirely within the 14:00-15:00 hour bucket → Bulk count all 12,288 docs</text><text x="50" y="440" class="subtitle">Doc Value Lookup Comparison:</text><rect width="550" height="360" x="50" y="460" class="comparison-box" style="fill:#fee"/><text x="325" y="490" class="label" text-anchor="middle" style="font-weight:700;font-size:16px">WITHOUT Skiplist</text><text x="70" y="520" class="label" style="font-weight:700">For each document (288,000 total):</text><circle cx="80" cy="545" r="5" fill="#e74c3c"/><text x="95" y="550" class="small-label">1. Read doc value for @timestamp</text><circle cx="80" cy="570" r="5" fill="#e74c3c"/><text x="95" y="575" class="small-label">2. Check if status=200 (filter match)</text><circle cx="80" cy="595" r="5" fill="#e74c3c"/><text x="95" y="600" class="small-label">3. Determine which hour bucket (0-23)</text><circle cx="80" cy="620" r="5" fill="#e74c3c"/><text x="95" y="625" class="small-label">4. Increment bucket counter</text><rect width="510" height="80" x="70" y="645" fill="#fff" stroke="#e74c3c" stroke-width="2"/><text x="325" y="670" class="metric skip-text" text-anchor="middle">Total Doc Value Lookups: 288,000</text><text x="325" y="690" class="small-label" text-anchor="middle">Every document requires reading @timestamp</text><text x="325" y="710" class="small-label" text-anchor="middle">from doc values to determine bucket assignment</text><text x="325" y="745" class="label" text-anchor="middle" style="font-weight:700">Processing Time: ~850ms</text><text x="325" y="765" class="small-label" text-anchor="middle">(assuming ~3μs per doc value lookup)</text><text x="325" y="805" class="metric skip-text" text-anchor="middle" style="font-size:18px">❌ High CPU overhead</text><rect width="500" height="360" x="650" y="460" class="comparison-box" style="fill:#efe"/><text x="900" y="490" class="label" text-anchor="middle" style="font-weight:700;font-size:16px">WITH Skiplist</text><text x="670" y="520" class="label" style="font-weight:700">For each block (70 blocks):</text><circle cx="680" cy="545" r="5" fill="#27ae60"/><text x="695" y="550" class="small-label">1. Read block metadata (min, max, count)</text><circle cx="680" cy="570" r="5" fill="#27ae60"/><text x="695" y="575" class="small-label">2. Check if block fully within hour bucket</text><circle cx="680" cy="595" r="5" fill="#27ae60"/><text x="695" y="600" class="small-label">3. If yes: Add block count to bucket</text><circle cx="680" cy="620" r="5" fill="#f39c12"/><text x="695" y="625" class="small-label">4. If no: Process docs individually</text><rect width="460" height="80" x="670" y="645" fill="#fff" stroke="#27ae60" stroke-width="2"/><text x="900" y="665" class="metric count-text" text-anchor="middle">Bulk Counted: ~245,760 docs (60 blocks)</text><text x="900" y="685" class="small-label" text-anchor="middle">No individual doc value lookups needed!</text><text x="900" y="705" class="metric process-text" text-anchor="middle">Individually Processed: ~42,240 docs</text><text x="900" y="720" class="small-label" text-anchor="middle">(10 boundary blocks spanning hour transitions)</text><text x="900" y="745" class="label" text-anchor="middle" style="font-weight:700">Processing Time: ~130ms</text><text x="900" y="765" class="small-label" text-anchor="middle">(70 metadata reads + 42,240 doc value lookups)</text><text x="900" y="805" class="count-text metric" text-anchor="middle" style="font-size:18px">✓ 85% reduction in lookups</text><rect width="1100" height="50" x="50" y="840" fill="#3498db" stroke="#3498db" stroke-width="3" opacity=".1"/><text x="600" y="865" class="label" text-anchor="middle" style="font-weight:700;font-size:16px;fill:#2980b9">Performance Gain: 6.5x faster (850ms → 130ms) | 85% fewer doc value lookups (288,000 → 42,240)</text></svg>